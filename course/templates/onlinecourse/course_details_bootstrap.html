<!DOCTYPE html>
<html>
<head>
    <title>Course Details</title>

    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <h1>{{ course.name }}</h1>

    <p>{{ course.description }}</p>

    <hr>

    <h3>Lessons</h3>

    <ul class="list-group">

        {% for lesson in lessons %}

        <li class="list-group-item">

            <h5>{{ lesson.title }}</h5>

            <p>{{ lesson.content }}</p>

        </li>

        {% endfor %}

    </ul>

</div>

</body>
</html>
